name: probe

# Phase 1 probe spike (SPEC.md §8). Runs on push to claude/** branches that touch the
# probe, or manually once this file is on main. Results go to the probe-fixtures branch.
on:
  push:
    branches: ["claude/**"]
    paths: ["probe/**", "tests/probe/**", "conftest.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  test:
    # Offline tests. The only job that installs from PyPI; it gets no secrets and read-only access.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pytest==8.3.3"
      - run: python -m pytest tests/probe -q

  probe:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      # The probe is stdlib-only; -S skips site-packages so nothing third-party runs alongside secrets.
      - name: Run probe
        env:
          FP_COOKIE: ${{ secrets.FP_COOKIE }}
          FP_EMAIL: ${{ secrets.FP_EMAIL }}
          FP_PASSWORD: ${{ secrets.FP_PASSWORD }}
          FP_DATA_KEY: ${{ secrets.FP_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -S -m probe.probe --out out

      - name: Leak guard (output)
        env:
          FP_COOKIE: ${{ secrets.FP_COOKIE }}
          FP_EMAIL: ${{ secrets.FP_EMAIL }}
          FP_PASSWORD: ${{ secrets.FP_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -S -m probe.leakcheck out

      - name: Job summary
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to probe-fixtures branch
        env:
          FP_COOKIE: ${{ secrets.FP_COOKIE }}
          FP_EMAIL: ${{ secrets.FP_EMAIL }}
          FP_PASSWORD: ${{ secrets.FP_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/fixtures"
          rc=0
          git ls-remote --exit-code origin refs/heads/probe-fixtures >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin refs/heads/probe-fixtures
            git worktree add -B probe-fixtures "$wt" FETCH_HEAD
          elif [ "$rc" -eq 2 ]; then
            git worktree add --detach "$wt"
            git -C "$wt" checkout --orphan probe-fixtures
            git -C "$wt" rm -rfq .
          else
            echo "git ls-remote failed (exit $rc)" >&2
            exit 1
          fi
          rm -rf "$wt/latest"
          mkdir -p "$wt/latest" "$wt/runs/$run_id"
          cp -R out/. "$wt/latest/"
          cp -R out/. "$wt/runs/$run_id/"
          git -C "$wt" add -A
          python -S -m probe.leakcheck --staged "$wt"
          git -C "$wt" commit -qm "probe run $run_id (${GITHUB_SHA::7})"
          git -C "$wt" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/probe-fixtures
