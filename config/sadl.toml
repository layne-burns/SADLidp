# SADL IDP streamer configuration (SPEC.md §9). Values here are tunables, not secrets.

[league]
username = "lbburnsy"
names = ["SADL", "Slow Ass Draft League"]
# league_id = ""            # optional override of the name match (SPEC §4.2)

[espn]
league_id = "942104146"     # owner's public IDP league (Phase 3 source)

[roster]
position_limit = 2          # used only if Sleeper's settings have no position_limit_* keys

[display]
depth = 25                  # players shown per position tab

[tiers]
z = 0.75                    # strictness of anchored significance tiers (SPEC §6.6); tuned 2026-10-12 with `sadlidp tune`
nu0 = 2                     # shrinkage pseudo-count for between-source spread (SPEC §6.4)
s0_default = 1.0            # between-source SD assumed until >=3-source players exist

[tiers.sigma_floor]
DL = 0.75
LB = 0.75
DB = 0.75

[swap]
threshold = 0.6             # START/UPGRADE badge probability (SPEC §6.7)

[swing]                     # per-player game-to-game swing for START/UPGRADE odds and each card's floor–ceiling (SPEC §6.7)
enabled = true
lo = -0.8                   # floor = μ + lo·swing, ceiling = μ + hi·swing: 1 game in 5 below, 1 in 5 above (2025 archive)
hi = 0.75

[swing.a]                   # swing² = a + b · Σ (points per stat)² × projected stat; fitted on 2025 (`sadlidp backtest run`)
DL = 0.0
LB = 18.0
DB = 27.0

[swing.b]
DL = 2.5
LB = 1.35
DB = 0.65

[sigma_out]                 # per-position weekly outcome SD: the fallback when a player has no projected stats
method = "last_season"      # "residuals": this season's errors once 3 settled weeks exist (SPEC §6.7)
DL = 5.0
LB = 5.5
DB = 5.0

[weights]
prior_split = 0.6           # projection : rank group prior (D11)
k = 4                       # shrinkage of the accuracy weights, in weeks: after n weeks the data counts n/(n+k) (§6.5)

[accuracy]                  # accuracy weights (SPEC §6.5 Implementation)
untrusted = []              # sources whose archived/late rows don't count yet; Sleeper, ESPN and FP have passed (§13)

[form]                      # the form term added to μ (SPEC §6.4): his earlier misses this season and his last game's snaps
enabled = true
k = 4                       # shrinkage: after n games a player's mean miss counts n/(n+k) of itself

[form.miss]                 # points per point of shrunk mean miss; fitted on the 2025 archive (`sadlidp backtest run`)
DL = 0.45
LB = 0.40
DB = 0.20

[form.snap]                 # points per 100% of last game's defensive snap share, relative to the position's 60 best-projected
DL = 7.5
LB = 5.5
DB = 4.0

[sources]
max_source_age_h = 96
shrink_guard = 0.6          # a fetch with fewer rows than this share of the stored rows is skipped (SPEC §7)

[sources.sleeper_proj]
enabled = true
late_rows = true            # keep projections first seen after kickoff, flagged late (SPEC §6.5)
archive = true              # past weeks still served: the backfill runner fills them (SPEC §5.3)

[sources.espn_proj]         # the owner's public ESPN league ([espn] league_id; SPEC §5.2)
enabled = true
archive = true              # past weeks through scoringPeriodId
late_rows = false

[sources.fp_ecr]            # FantasyPros weekly ECR, DL/LB/DB pages, free and logged out (D9; SPEC §5.2)
enabled = true
archive = true              # past weeks through ?week=N
late_rows = false

[sources.fp_dst]            # FantasyPros D/ST ranks: a signal, stored and backfilled, never blended (D18)
enabled = true
archive = true

[censor]
M = 10                      # unlisted players ranked up to depth + M by projection get a censored rank (SPEC §6.4)

[backfill]                  # per sync, after the live fetches (SPEC §5.3); the rest waits for the next sync
budget_s = 300
max_requests = 40           # per host

[net.host_interval_s]       # seconds between requests to one host; others wait net.Client's 2 s (SPEC §7)
"lm-api-reads.fantasy.espn.com" = 1.0
"www.fantasypros.com" = 5.0  # its robots.txt crawl delay

# [impute.m_k]              # overrides the empirical-Bayes m_k in data/<prev>/impute_priors.json (SPEC §6.2)
# idp_tkl_loss = 50.0

[gate]
pre_waiver_open_h = 12      # window opens this many hours before waivers process
pre_waiver_close_h = 1
saturday_open_et = "12:00"
saturday_close_et = "18:00"
sunday_open_h = 4           # before the first Sunday kickoff
sunday_close_min = 15
results_after_h = 4.25      # Sunday-evening results sync: this long after the last daytime kickoff (games final at +4 h)
results_window_h = 6
