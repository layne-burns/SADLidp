# SADL IDP streamer configuration (SPEC.md §9). Values here are tunables, not secrets.

[league]
username = "lbburnsy"
names = ["SADL", "Slow Ass Draft League"]
# league_id = ""            # optional override of the name match (SPEC §4.2)

[espn]
league_id = "942104146"     # owner's public IDP league (Phase 3 source)

[roster]
position_limit = 2          # used only if Sleeper's settings have no position_limit_* keys

[display]
depth = 25                  # players shown per position tab

[tiers]
z = 1.0                     # strictness of anchored significance tiers (SPEC §6.6)
nu0 = 2                     # shrinkage pseudo-count for between-source spread (SPEC §6.4)
s0_default = 1.0            # between-source SD assumed until >=3-source players exist

[tiers.sigma_floor]
DL = 0.75
LB = 0.75
DB = 0.75

[swap]
threshold = 0.6             # START/UPGRADE badge probability (SPEC §6.7)

[sigma_out]                 # per-position weekly outcome SD fallback if last season can't be read
method = "last_season"      # "residuals": this season's errors once 3 settled weeks exist (SPEC §6.7)
DL = 5.0
LB = 5.5
DB = 5.0

[weights]
prior_split = 0.6           # projection : rank group prior (D11)

[sources]
max_source_age_h = 96
shrink_guard = 0.6          # a fetch with fewer rows than this share of the stored rows is skipped (SPEC §7)

[sources.sleeper_proj]
enabled = true
late_rows = true            # keep projections first seen after kickoff, flagged late (SPEC §6.5)
archive = true              # past weeks still served: the backfill runner fills them (SPEC §5.3)

[sources.espn_proj]         # the owner's public ESPN league ([espn] league_id; SPEC §5.2)
enabled = true
archive = true              # past weeks through scoringPeriodId
late_rows = false

[sources.fantasypros]       # free weekly ECR, DL/LB/DB pages (SPEC §5.2); ranks mapped onto projections (§6.4)
enabled = true
archive = true              # past weeks through ?week=N; rows touched after kickoff are dropped
late_rows = false
prior_weight = 0.5          # within the rank group (a 26-expert aggregate; §6.4)

[sources.fp_dst]            # FantasyPros D/ST ECR: a signal shown as context, never blended (D18)
enabled = true
archive = true

[censor]
M = 10                      # an unlisted player with P⁰-rank ≤ D+M gets the rank max(D+1, P⁰-rank) (SPEC §6.4)

[backfill]                  # per sync, after the live fetches (SPEC §5.3); the rest waits for the next sync
budget_s = 300
max_requests = 40           # per host

[net.host_interval_s]       # seconds between requests to one host; others wait net.Client's 2 s (SPEC §7)
"lm-api-reads.fantasy.espn.com" = 1.0
"www.fantasypros.com" = 5.0  # its robots.txt crawl delay

# [impute.m_k]              # overrides the empirical-Bayes m_k in data/<prev>/impute_priors.json (SPEC §6.2)
# idp_tkl_loss = 50.0

[gate]
pre_waiver_open_h = 12      # window opens this many hours before waivers process
pre_waiver_close_h = 1
saturday_open_et = "12:00"
saturday_close_et = "18:00"
sunday_open_h = 4           # before the first Sunday kickoff
sunday_close_min = 15
results_after_h = 4.25      # Sunday-evening results sync: this long after the last daytime kickoff (games final at +4 h)
results_window_h = 6
