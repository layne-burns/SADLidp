[project]
name = "sadlidp"
version = "0.1.0"
description = "Weekly IDP streaming tiers for the SADL Sleeper league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1"]

[project.scripts]
sadlidp = "sadlidp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadlidp"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["probe", "tests/probe"]  # frozen Phase 1 spike, linted under its own rules

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sadlidp", "probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
